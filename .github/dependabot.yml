version: 2
updates:
  # Keep npm/pnpm dependencies current (doc 21 — Dependency Security).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Bundle patch+minor updates to reduce PR noise; major updates
      # get their own PRs so they're reviewed deliberately.
      patch-and-minor:
        update-types:
          - patch
          - minor

  # Keep GitHub Actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
